<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Bala Vinayaka - Battle of Asuras
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >
</head>

<body>

    <!-- ================= MAIN MENU ================= -->

    <main id="mainMenu" class="screen active">

        <div class="background-glow glow-one"></div>
        <div class="background-glow glow-two"></div>

        <header class="top-bar">

            <div class="game-logo">
                <div class="logo-small">
                    BALA VINAYAKA
                </div>

                <div class="logo-large">
                    BATTLE OF ASURAS
                </div>
            </div>

            <div class="top-actions">

                <button
                    id="profileButton"
                    class="icon-button"
                >
                    👤
                    <span>PROFILE</span>
                </button>

                <button
                    id="soundButton"
                    class="icon-button"
                >
                    🔊
                </button>

                <button
                    id="musicButton"
                    class="icon-button"
                >
                    🎵
                </button>

                <button
                    id="settingsButton"
                    class="icon-button"
                >
                    ⚙
                </button>

            </div>

        </header>


        <!-- CENTER CHARACTER -->

        <section class="hero">

            <div class="divine-circle"></div>

            <div class="golden-light"></div>

            <img
                id="ganeshaImage"
                src="https://i.ibb.co/dwbMtnpL/Gemini-Generated-Image-vmqclxvmqclxvmqc-removebg-preview.png"
                alt="Bala Vinayaka"
            >

            <div class="hero-ground"></div>

            <div class="hero-label">
                <span>✦</span>
                THE DIVINE WARRIOR
                <span>✦</span>
            </div>

        </section>


        <!-- RIGHT MENU -->

        <nav class="side-menu">

            <button
                id="startButton"
                class="menu-button start"
            >
                <span>⚔</span>
                START BATTLE
            </button>

            <button
                id="weaponsButton"
                class="menu-button"
            >
                <span>🪓</span>
                WEAPONS
            </button>

            <button
                id="skillsButton"
                class="menu-button"
            >
                <span>✦</span>
                SKILLS
            </button>

            <button
                id="skinsButton"
                class="menu-button"
            >
                <span>👑</span>
                SKINS
            </button>

            <button
                id="othersButton"
                class="menu-button"
            >
                <span>☰</span>
                OTHERS
            </button>

        </nav>


        <div class="tagline">
            “Prayer as our sword,
            <br>
            
            Faith as our shield”

            
        </div>

    </main>


    <!-- ================= LOADING ================= -->

    <section
        id="loadingScreen"
        class="screen loading-screen"
    >

        <div class="loading-content">

            <div class="loading-symbol">
                ॐ
            </div>

            <h1>
                BALA VINAYAKA
            </h1>

            <p>
                Preparing for Battle...
            </p>

            <div class="loading-bar">
                <div
                    id="loadingProgress"
                    class="loading-progress"
                ></div>
            </div>

            <div id="loadingPercent">
                0%
            </div>

            <div class="loading-subtitle">
                ✦ THE FIRST ASURA ✦
            </div>

        </div>

    </section>


    <!-- ================= GAME SCREEN ================= -->

    <section
        id="gameScreen"
        class="screen game-screen"
    >

        <div class="battle-background">

            <div class="mountain mountain-one"></div>
            <div class="mountain mountain-two"></div>

            <div class="temple">
                🛕
            </div>

            <div class="battle-particles">
                ✦ ✧ ✦ ✧ ✦
            </div>

        </div>


        <!-- BATTLE TOP -->

        <div class="battle-header">

            <button
                id="backButton"
                class="back-button"
            >
                ← MENU
            </button>

            <div class="battle-title">
                <small>LEVEL 1</small>
                <strong id="battleLevelTitle">
                    THE FIRST ASURA
                </strong>
            </div>

            <div class="battle-energy">
                <span>⚡</span>
                <span id="battleEnergy">
                    100
                </span>
            </div>

        </div>


        <!-- PLAYER -->

        <div class="battle-character battle-player">

            <div class="character-aura"></div>

            <div
                id="battlePlayer"
                class="battle-character-icon"
            >
                <image src="https://i.ibb.co/YTFXwJ2v/Chat-GPT-Image-Sep-21-2026-05-29-54-PM.png" alt="Bala Vinayaka" height="150px" >
            </div>

            <div class="battle-name">
                BALA VINAYAKA
            </div>

            <div class="health-wrapper">

                <div class="health-bar">

                    <div
                        id="playerHealth"
                        class="health-fill player-health"
                    ></div>

                </div>

                <span id="playerHpText">
                    
                </span>

            </div>

        </div>


        <!-- VS -->

        <div class="vs-symbol">
            VS
        </div>


        <!-- ENEMY -->

        <div class="battle-character battle-enemy">

            <div
                id="battleEnemy"
                class="enemy-character"
            >
                <image src="https://i.ibb.co/TDvDmB91/Chat-GPT-Image-Sep-21-2026-05-28-10-PM.png" alt="Forest Asura" height="150px" >
            </div>

            <div class="battle-name enemy-name">
                FOREST ASURA
            </div>

            <div class="health-wrapper">

                <div class="health-bar">

                    <div
                        id="enemyHealth"
                        class="health-fill enemy-health"
                    ></div>

                </div>

                <span id="enemyHpText">
                    
                </span>

            </div>

        </div>


        <!-- MESSAGE -->

        <div
            id="battleMessage"
            class="battle-message"
        >
            The battle begins!
        </div>


        <!-- CONTROLS -->

        <div class="battle-controls">

            <button
                id="attackButton"
                class="battle-button attack"
            >
                ⚔
                <span>ATTACK</span>
            </button>

            <button
                id="skillButton"
                class="battle-button skill"
            >
                ✦
                <span>DIVINE STRIKE</span>
            </button>

            <button
                id="defendButton"
                class="battle-button"
            >
                🛡
                <span>DEFEND</span>
            </button>

            <button
                id="dodgeButton"
                class="battle-button"
            >
                ◈
                <span>DODGE</span>
            </button>

        </div>

    </section>


    <!-- ================= INFO PANEL ================= -->

    <div
        id="infoPanel"
        class="modal hidden"
    >

        <div class="modal-box">

            <button
                id="closeInfo"
                class="close-button"
            >
                ×
            </button>

            <div
                id="infoTitle"
                class="modal-title"
            >
                PROFILE
            </div>

            <div
                id="infoText"
                class="modal-content"
            >
                Loading...
            </div>

        </div>

    </div>


    <!-- IMPORTANT:
         main.js is in the SAME folder as index.html.
    -->

    <script src="./main.js"></script>

</body>

</html>
